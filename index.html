<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>rAlabaster Productieplanner</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<header><a class="brand" href="#" aria-label="rAlabaster" style="display:flex;align-items:center;flex:0 0 auto"><img id="brandLogo" class="brand-logo" alt="rAlabaster" style="height:42px;width:auto;display:block"></a><nav>
<button class="navbtn active" data-view="today">Vandaag</button>
<button class="navbtn" data-view="weeks">3 weken</button>
<button class="navbtn" data-view="orders">Orders</button>
<button class="navbtn" data-view="external">Extern / binnenmelden</button>
<button class="navbtn" data-view="import">Importeren</button>
<button class="navbtn" data-view="history">Historie</button>
<button class="navbtn" data-view="settings">Online instellingen</button>
</nav></header>
<main>
<section id="view-today"></section>
<section id="view-weeks" class="hidden"></section>
<section id="view-orders" class="hidden"></section>
<section id="view-external" class="hidden"></section>
<section id="view-import" class="hidden"></section>
<section id="view-history" class="hidden"></section>
<section id="view-settings" class="hidden"></section>
</main>
<div id="printArea"></div>
<div id="modalRoot"></div>
<script>
fetch('assets/ralabaster-logo.b64.txt')
  .then(r => { if (!r.ok) throw new Error('Logo niet gevonden'); return r.text(); })
  .then(b64 => {
    const raw = atob(b64.trim());
    const bytes = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    document.getElementById('brandLogo').src = URL.createObjectURL(new Blob([bytes], {type:'image/jpeg'}));
  })
  .catch(() => { document.querySelector('.brand').style.display='none'; });
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script src="assets/custom.js"></script>
</body>
</html>
