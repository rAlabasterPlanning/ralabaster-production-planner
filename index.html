<script>
document.getElementById('refreshAppBtn')?.addEventListener('click',function(e){
  e.preventDefault();
  const url=new URL(location.href);
  url.searchParams.set('_refresh',Date.now().toString());
  location.replace(url.toString());
});
document.addEventListener('click',function(e){
  const b=e.target.closest('.erp-nav');
  if(!b)return;
  e.preventDefault();e.stopImmediatePropagation();
  const v=b.dataset.view;
  requestAnimationFrame(()=>{
    if(window.RALAB_ERP)window.RALAB_ERP.show(v);
    if(v==='dashboard'&&window.RALAB_COMMERCIAL)window.RALAB_COMMERCIAL.renderDashboard();
  });
},true);
</script>
