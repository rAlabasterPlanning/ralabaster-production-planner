<script>
document.getElementById('refreshAppBtn')?.addEventListener('click',function(e){
  e.preventDefault();
  const url=new URL(location.href);
  url.searchParams.set('_refresh',Date.now().toString());
  location.replace(url.toString());
});
function closeMoreMenu(){
  const menu=document.querySelector('.nav-more-menu'),trigger=document.querySelector('.nav-more-trigger');
  menu?.setAttribute('hidden','');trigger?.setAttribute('aria-expanded','false');
}
function positionMoreMenu(){
  const trigger=document.querySelector('.nav-more-trigger'),menu=document.querySelector('.nav-more-menu');
  if(!trigger||!menu||menu.hasAttribute('hidden'))return;
  const r=trigger.getBoundingClientRect(),margin=8,width=Math.max(210,menu.offsetWidth||210);
  let left=Math.min(window.innerWidth-width-margin,Math.max(margin,r.left));
  let top=r.bottom+6;
  if(top+(menu.offsetHeight||320)>window.innerHeight-margin)top=Math.max(margin,r.top-(menu.offsetHeight||320)-6);
  menu.style.left=Math.round(left)+'px';menu.style.top=Math.round(top)+'px';menu.style.right='auto';
}
document.addEventListener('click',function(e){
  const trigger=e.target.closest('.nav-more-trigger');
  if(trigger){
    e.preventDefault();e.stopImmediatePropagation();
    const menu=document.querySelector('.nav-more-menu'),opening=menu?.hasAttribute('hidden');
    closeMoreMenu();
    if(opening&&menu){menu.removeAttribute('hidden');trigger.setAttribute('aria-expanded','true');requestAnimationFrame(positionMoreMenu)}
    return;
  }
  const moreItem=e.target.closest('.nav-more [data-view]');
  if(moreItem)closeMoreMenu();
  else if(!e.target.closest('.nav-more'))closeMoreMenu();

  const b=e.target.closest('.erp-nav');
  if(!b)return;
  e.preventDefault();e.stopImmediatePropagation();
  const v=b.dataset.view;
  requestAnimationFrame(()=>{
    if(window.RALAB_ERP)window.RALAB_ERP.show(v);
    if(v==='dashboard'&&window.RALAB_COMMERCIAL)window.RALAB_COMMERCIAL.renderDashboard();
    closeMoreMenu();
  });
},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMoreMenu()});
window.addEventListener('resize',()=>{if(!document.querySelector('.nav-more-menu')?.hasAttribute('hidden'))positionMoreMenu()});
window.addEventListener('scroll',()=>{if(!document.querySelector('.nav-more-menu')?.hasAttribute('hidden'))positionMoreMenu()},{passive:true});
</script>
